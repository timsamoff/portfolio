<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Jones | Portfolio Demo</title>
    
    <!-- Default meta tags -->
    <meta property="og:title" content="Demo Jones | Portfolio Demo">
    <meta property="og:description" content="A fully functional demo of the portfolio management system. All project data is stored locally in your browser using localStorage.">
    <meta property="og:image" content="https://samoff.com/portfolio/demo/tsp_social.png">
    <meta property="og:url" content="https://samoff.com/portfolio/demo/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Demo Jones | Portfolio Demo">
    <meta name="twitter:description" content="A fully functional demo of the portfolio management system. All project data is stored locally in your browser using localStorage.">
    <meta name="twitter:image" content="https://samoff.com/portfolio/demo/tsp_social.png">
    
    <!-- Use absolute path to CSS -->
    <link rel="stylesheet" href="/portfolio/style.css">
    
    <style>
        /* Inline critical styles so they always load */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: #ededee;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
        }
        
        .share-loading {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .share-loading header {
            border-bottom: 1px solid #2a2a30;
            padding: 1rem 2rem 0.75rem;
            background: #0a0a0f;
        }
        
        .share-loading .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 0 auto;
            max-width: 1400px;
        }
        
        .share-loading .logo-zone h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ededee 0%, #e5484d 33%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        
        .share-loading .demo-badge {
            font-size: 0.6rem;
            background: #e5484d;
            color: white;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
        
        .share-loading .contact-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1f1f24;
            border: 1px solid #2a2a30;
            border-radius: 100px;
            padding: 0 1.1rem;
            height: 42px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #a1a1aa;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .share-loading .contact-btn:hover {
            background: #e5484d;
            border-color: #e5484d;
            color: #ffffff;
        }
        
        .share-loading .contact-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .share-loading .loading-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .share-loading .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #2a2a30;
            border-top-color: #e5484d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .share-loading .loading-text {
            font-size: 1.2rem;
            color: #ededee;
            font-weight: 500;
        }
        
        .share-loading .loading-sub {
            font-size: 0.85rem;
            color: #71717a;
            margin-top: 0.5rem;
        }
        
        .share-loading footer {
            border-top: 1px solid #2a2a30;
            padding: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #71717a;
            background: #0a0a0f;
        }
        
        .share-loading footer .demo-footer-note {
            color: #71717a;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="share-loading">
        <header>
            <div class="header-container">
                <div class="logo-zone">
                    <h1>Demo Jones | Portfolio <span class="demo-badge">DEMO</span></h1>
                </div>
                <div class="header-actions">
                    <a href="mailto:demo@jones.com" class="contact-btn" aria-label="Send email">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>Contact</span>
                    </a>
                </div>
            </div>
        </header>
        
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loading-text">Loading project...</div>
            <div class="loading-sub">You'll be redirected automatically</div>
        </div>
        
        <footer>
            <p>Built with &#10084; by Tim Samoff. <span class="demo-footer-note">(Demo mode — data stored in localStorage)</span></p>
        </footer>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const shareData = params.get('share');
            
            if (!shareData) {
                window.location.href = 'https://samoff.com/portfolio/demo/';
                return;
            }
            
            let decoded;
            try {
                decoded = JSON.parse(atob(decodeURIComponent(shareData)));
            } catch(e) {
                console.error('Invalid share data:', e);
                window.location.href = 'https://samoff.com/portfolio/demo/';
                return;
            }
            
            const loadingText = document.getElementById('loading-text');
            
            // Get projects from localStorage or fallback
            let projects = [];
            const stored = localStorage.getItem('demo_portfolio_projects');
            if (stored) {
                try { projects = JSON.parse(stored); } catch(e) {}
            }
            if (!projects || projects.length === 0) {
                if (window.DEMO_PROJECTS) {
                    projects = window.DEMO_PROJECTS;
                }
            }
            
            const project = projects[decoded.p];
            if (!project) {
                window.location.href = 'https://samoff.com/portfolio/demo/';
                return;
            }
            
            // Update loading text
            if (loadingText) {
                loadingText.textContent = `Loading ${project.title}...`;
            }
            
            const title = `Demo Jones | Portfolio - ${project.title}`;
            document.title = title;
            
            function setMeta(selector, content) {
                let el = document.querySelector(selector);
                if (!el) {
                    el = document.createElement('meta');
                    const isProperty = selector.startsWith('[property=');
                    if (isProperty) {
                        const prop = selector.match(/property="([^"]+)"/)[1];
                        el.setAttribute('property', prop);
                    } else {
                        const name = selector.match(/name="([^"]+)"/)[1];
                        el.setAttribute('name', name);
                    }
                    document.head.appendChild(el);
                }
                el.setAttribute('content', content);
            }
            
            setMeta('[property="og:title"]', title);
            setMeta('[name="twitter:title"]', title);
            
            let description = project.description || '';
            description = description.replace(/<[^>]*>/g, '');
            if (description.length > 150) description = description.substring(0, 147) + '...';
            if (!description) {
                description = 'A fully functional demo of the portfolio management system. All project data is stored locally in your browser using localStorage.';
            }
            setMeta('[property="og:description"]', description);
            setMeta('[name="twitter:description"]', description);
            
            let media = 'tsp_social.png';
            if (project.media && project.media.length > 0) {
                media = project.media[0];
            }
            if (!media.startsWith('http://') && !media.startsWith('https://')) {
                media = 'https://samoff.com/portfolio/demo/' + media.replace(/^\.?\//, '');
            }
            setMeta('[property="og:image"]', media);
            setMeta('[name="twitter:image"]', media);
            
            setMeta('[property="og:url"]', 'https://samoff.com/portfolio/demo/');
            
            setTimeout(function() {
                window.location.href = 'https://samoff.com/portfolio/demo/?share=' + encodeURIComponent(shareData);
            }, 1500);
        })();
    </script>
</body>
</html>
