<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Jones | Portfolio Demo</title>
    
    <!-- Default meta tags -->
    <meta property="og:title" content="Demo Jones | Portfolio Demo">
    <meta property="og:description" content="A fully functional demo of the portfolio management system. All project data is stored locally in your browser using localStorage.">
    <meta property="og:image" content="https://samoff.com/portfolio/demo/tsp_social.png">
    <meta property="og:url" content="https://samoff.com/portfolio/demo/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Demo Jones | Portfolio Demo">
    <meta name="twitter:description" content="A fully functional demo of the portfolio management system. All project data is stored locally in your browser using localStorage.">
    <meta name="twitter:image" content="https://samoff.com/portfolio/demo/tsp_social.png">
    
    <!-- Theme color for browsers -->
    <meta name="theme-color" content="#0a0a0f">
    
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="../style.css">
    
    <!-- Minimal additional styles for the loading state -->
    <style>
        /* Only the loading-specific styles that aren't in style.css */
        .share-loading {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .share-loading .loading-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .share-loading .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(42, 42, 48, 0.5);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .share-loading .loading-text {
            font-size: 1.2rem;
            color: var(--color-text);
            font-weight: 500;
        }
        
        .share-loading .loading-sub {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-top: 0.5rem;
        }
        
        /* Demo badge styling */
        .share-loading .demo-badge {
            font-size: 0.6rem;
            background: var(--color-accent);
            color: var(--color-white);
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
        
        /* Override header background to be transparent on share page */
        .share-loading header {
            background: transparent !important;
        }
        
        /* Override footer background to be transparent on share page */
        .share-loading footer {
            background: transparent !important;
            border-top-color: rgba(42, 42, 48, 0.3) !important;
        }
        
        .share-loading footer .demo-footer-note {
            color: var(--color-text-muted);
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="share-loading">
        <!-- Use the same hero background from index.html -->
        <div class="hero-bg">
            <svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="shareFlow1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--color-accent);stop-opacity:0" />
                        <stop offset="30%" style="stop-color:var(--color-accent);stop-opacity:0.25" />
                        <stop offset="70%" style="stop-color:var(--color-accent);stop-opacity:0.25" />
                        <stop offset="100%" style="stop-color:var(--color-accent);stop-opacity:0" />
                    </linearGradient>
                    <linearGradient id="shareFlow2" x1="100%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--color-accent);stop-opacity:0" />
                        <stop offset="40%" style="stop-color:var(--color-accent);stop-opacity:0.15" />
                        <stop offset="60%" style="stop-color:var(--color-accent);stop-opacity:0.15" />
                        <stop offset="100%" style="stop-color:var(--color-accent);stop-opacity:0" />
                    </linearGradient>
                    <radialGradient id="shareGlowOrb" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:var(--color-accent);stop-opacity:0.3" />
                        <stop offset="50%" style="stop-color:var(--color-accent);stop-opacity:0.1" />
                        <stop offset="100%" style="stop-color:var(--color-accent);stop-opacity:0" />
                    </radialGradient>
                    <filter id="shareSoftGlow">
                        <feGaussianBlur stdDeviation="4" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <path class="wave wave-1" d="M-100,200 C100,50 300,350 500,150 C700,-50 900,300 1100,100 C1200,0 1300,200 1400,150" fill="none" stroke="url(#shareFlow1)" stroke-width="3" filter="url(#shareSoftGlow)"/>
                <path class="wave wave-2" d="M-100,350 C150,200 350,500 550,250 C750,0 950,400 1150,200 C1250,100 1350,300 1450,250" fill="none" stroke="url(#shareFlow2)" stroke-width="2" filter="url(#shareSoftGlow)"/>
                <path class="wave wave-3" d="M-100,450 C200,300 400,600 600,350 C800,100 1000,450 1200,300 C1300,200 1400,400 1500,350" fill="none" stroke="var(--color-accent)" stroke-width="1.5" opacity="0.15"/>
                
                <circle class="orb orb-1" cx="150" cy="120" r="30" fill="url(#shareGlowOrb)" filter="url(#shareSoftGlow)"/>
                <circle class="orb orb-2" cx="750" cy="380" r="45" fill="url(#shareGlowOrb)" filter="url(#shareSoftGlow)"/>
                <circle class="orb orb-3" cx="1050" cy="180" r="25" fill="url(#shareGlowOrb)" filter="url(#shareSoftGlow)"/>
                <circle class="orb orb-4" cx="350" cy="480" r="35" fill="url(#shareGlowOrb)" filter="url(#shareSoftGlow)"/>
                
                <circle class="particle particle-1" cx="200" cy="250" r="2" fill="var(--color-accent)" opacity="0.4"/>
                <circle class="particle particle-2" cx="450" cy="150" r="1.5" fill="var(--color-accent)" opacity="0.3"/>
                <circle class="particle particle-3" cx="700" cy="300" r="2.5" fill="var(--color-accent)" opacity="0.35"/>
                <circle class="particle particle-4" cx="950" cy="420" r="1.5" fill="var(--color-accent)" opacity="0.25"/>
                <circle class="particle particle-5" cx="300" cy="400" r="2" fill="var(--color-accent)" opacity="0.3"/>
                <circle class="particle particle-6" cx="600" cy="100" r="1.5" fill="var(--color-accent)" opacity="0.2"/>
                <circle class="particle particle-7" cx="850" cy="200" r="2" fill="var(--color-accent)" opacity="0.3"/>
                <circle class="particle particle-8" cx="1100" cy="350" r="1.5" fill="var(--color-accent)" opacity="0.25"/>
                <circle class="particle particle-9" cx="150" cy="450" r="1.5" fill="var(--color-accent)" opacity="0.2"/>
                <circle class="particle particle-10" cx="500" cy="500" r="2" fill="var(--color-accent)" opacity="0.3"/>
                <circle class="particle particle-11" cx="1000" cy="100" r="1.5" fill="var(--color-accent)" opacity="0.2"/>
                <circle class="particle particle-12" cx="400" cy="300" r="2" fill="var(--color-accent)" opacity="0.25"/>
            </svg>
        </div>
        
        <header>
            <div class="header-container">
                <div class="logo-zone">
                    <h1>Demo Jones | Portfolio <span class="demo-badge">DEMO</span></h1>
                </div>
                <div class="header-actions">
                    <a href="mailto:demo@jones.com" class="contact-btn" aria-label="Send email">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>Contact</span>
                    </a>
                </div>
            </div>
        </header>
        
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loading-text">Loading project...</div>
            <div class="loading-sub">You'll be redirected automatically</div>
        </div>
        
        <footer>
            <p>Built with &#10084; by Tim Samoff. <span class="demo-footer-note">(Demo mode — data stored in localStorage)</span></p>
        </footer>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const shareData = params.get('share');
            
            if (!shareData) {
                window.location.href = 'https://samoff.com/portfolio/demo/';
                return;
            }
            
            let decoded;
            try {
                decoded = JSON.parse(atob(decodeURIComponent(shareData)));
            } catch(e) {
                console.error('Invalid share data:', e);
                window.location.href = 'https://samoff.com/portfolio/demo/';
                return;
            }
            
            const loadingText = document.getElementById('loading-text');
            
            // Get projects from localStorage or fallback
            let projects = [];
            const stored = localStorage.getItem('demo_portfolio_projects');
            if (stored) {
                try { projects = JSON.parse(stored); } catch(e) {}
            }
            if (!projects || projects.length === 0) {
                if (window.DEMO_PROJECTS) {
                    projects = window.DEMO_PROJECTS;
                }
            }
            
            const project = projects[decoded.p];
            if (!project) {
                window.location.href = 'https://samoff.com/portfolio/demo/';
                return;
            }
            
            // Update loading text
            if (loadingText) {
                loadingText.textContent = `Loading ${project.title}...`;
            }
            
            const title = `Demo Jones | Portfolio - ${project.title}`;
            document.title = title;
            
            function setMeta(selector, content) {
                let el = document.querySelector(selector);
                if (!el) {
                    el = document.createElement('meta');
                    const isProperty = selector.startsWith('[property=');
                    if (isProperty) {
                        const prop = selector.match(/property="([^"]+)"/)[1];
                        el.setAttribute('property', prop);
                    } else {
                        const name = selector.match(/name="([^"]+)"/)[1];
                        el.setAttribute('name', name);
                    }
                    document.head.appendChild(el);
                }
                el.setAttribute('content', content);
            }
            
            setMeta('[property="og:title"]', title);
            setMeta('[name="twitter:title"]', title);
            
            let description = project.description || '';
            description = description.replace(/<[^>]*>/g, '');
            if (description.length > 150) description = description.substring(0, 147) + '...';
            if (!description) {
                description = 'A fully functional demo of the portfolio management system. All project data is stored locally in your browser using localStorage.';
            }
            setMeta('[property="og:description"]', description);
            setMeta('[name="twitter:description"]', description);
            
            let media = 'tsp_social.png';
            if (project.media && project.media.length > 0) {
                media = project.media[0];
            }
            if (!media.startsWith('http://') && !media.startsWith('https://')) {
                media = 'https://samoff.com/portfolio/demo/' + media.replace(/^\.?\//, '');
            }
            setMeta('[property="og:image"]', media);
            setMeta('[name="twitter:image"]', media);
            
            setMeta('[property="og:url"]', 'https://samoff.com/portfolio/demo/');
            
            setTimeout(function() {
                window.location.href = 'https://samoff.com/portfolio/demo/?share=' + shareData;
            }, 1500);
        })();
    </script>
</body>
</html>
