<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Samoff | Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-zone">
                <h1>Tim Samoff</h1>
                <p class="subtitle">Multimedia Production & Design Since 1988</p>
            </div>
            <div class="header-actions">
                <a href="mailto:samoff@gmail.com" class="contact-btn" aria-label="Send email to Tim Samoff">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span>Contact</span>
                </a>
                <button id="theme-toggle" aria-label="Toggle light and dark mode">
                    <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="4.22" x2="19.78" y2="5.64"></line></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
        <nav class="filter-nav">
            <button class="filter-btn active" data-filter="all">All Projects</button>
            <button class="filter-btn" data-filter="brand">Brand & Identity</button>
            <button class="filter-btn" data-filter="production">Production & Installation</button>
            <button class="filter-btn" data-filter="games">Game Design</button>
            <button class="filter-btn" data-filter="web">Web & Interactive</button>
        </nav>
    </header>

    <main class="portfolio-container">
        <div class="portfolio-grid" id="portfolio-grid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Tim Samoff. Built with high-contrast structural semantics.</p>
    </footer>

    <!-- Custom Modal -->
    <div id="media-modal" class="media-modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-swiper-container">
                <div class="swiper modal-swiper">
                    <div class="swiper-wrapper" id="modal-swiper-wrapper"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
