<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Samoff | Portfolio</title>
    
    <!-- Default meta tags -->
    <meta property="og:title" content="Tim Samoff | Portfolio">
    <meta property="og:description" content="Interactive Production, Design &amp; Development. A curated collection of games, software, websites, and creative experiments.">
    <meta property="og:image" content="https://samoff.com/portfolio/tsp_social.png">
    <meta property="og:url" content="https://samoff.com/portfolio/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tim Samoff | Portfolio">
    <meta name="twitter:description" content="Interactive Production, Design &amp; Development. A curated collection of games, software, websites, and creative experiments.">
    <meta name="twitter:image" content="https://samoff.com/portfolio/tsp_social.png">
    
    <!-- Use absolute path to CSS -->
    <link rel="stylesheet" href="/portfolio/style.css">
    
    <style>
        /* Inline critical styles so they always load */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: #ededee;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
        }
        
        .share-loading {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .share-loading header {
            border-bottom: 1px solid #2a2a30;
            padding: 1rem 2rem 0.75rem;
            background: #0a0a0f;
        }
        
        .share-loading .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 0 auto;
            max-width: 1400px;
        }
        
        .share-loading .logo-zone h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ededee 0%, #e5484d 33%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        
        .share-loading .contact-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1f1f24;
            border: 1px solid #2a2a30;
            border-radius: 100px;
            padding: 0 1.1rem;
            height: 42px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #a1a1aa;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .share-loading .contact-btn:hover {
            background: #e5484d;
            border-color: #e5484d;
            color: #ffffff;
        }
        
        .share-loading .contact-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .share-loading .loading-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .share-loading .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #2a2a30;
            border-top-color: #e5484d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .share-loading .loading-text {
            font-size: 1.2rem;
            color: #ededee;
            font-weight: 500;
        }
        
        .share-loading .loading-sub {
            font-size: 0.85rem;
            color: #71717a;
            margin-top: 0.5rem;
        }
        
        .share-loading footer {
            border-top: 1px solid #2a2a30;
            padding: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #71717a;
            background: #0a0a0f;
        }
    </style>
</head>
<body>
    <div class="share-loading">
        <header>
            <div class="header-container">
                <div class="logo-zone">
                    <h1>Tim Samoff | Portfolio</h1>
                </div>
                <div class="header-actions">
                    <a href="mailto:samoff@gmail.com" class="contact-btn" aria-label="Send email">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>Contact</span>
                    </a>
                </div>
            </div>
        </header>
        
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loading-text">Loading project...</div>
            <div class="loading-sub">You'll be redirected automatically</div>
        </div>
        
        <footer>
            <p>Built with &#10084; by Tim Samoff.</p>
        </footer>
    </div>

    <script>
        (function() {
            // Parse share data from URL
            const params = new URLSearchParams(window.location.search);
            const shareData = params.get('share');
            
            if (!shareData) {
                window.location.href = 'https://samoff.com/portfolio/';
                return;
            }
            
            let decoded;
            try {
                decoded = JSON.parse(atob(decodeURIComponent(shareData)));
            } catch(e) {
                console.error('Invalid share data:', e);
                window.location.href = 'https://samoff.com/portfolio/';
                return;
            }
            
            // Update loading text
            const loadingText = document.getElementById('loading-text');
            
            // Fetch projects and update meta tags
            fetch('https://samoff.com/portfolio/projects.json')
                .then(r => r.json())
                .then(projects => {
                    const project = projects[decoded.p];
                    if (!project) {
                        window.location.href = 'https://samoff.com/portfolio/';
                        return;
                    }
                    
                    // Update loading text
                    if (loadingText) {
                        loadingText.textContent = `Loading ${project.title}...`;
                    }
                    
                    // Update page title
                    const title = `Tim Samoff | Portfolio - ${project.title}`;
                    document.title = title;
                    
                    // Helper to update or create meta tags
                    function setMeta(selector, content) {
                        let el = document.querySelector(selector);
                        if (!el) {
                            el = document.createElement('meta');
                            const isProperty = selector.startsWith('[property=');
                            if (isProperty) {
                                const prop = selector.match(/property="([^"]+)"/)[1];
                                el.setAttribute('property', prop);
                            } else {
                                const name = selector.match(/name="([^"]+)"/)[1];
                                el.setAttribute('name', name);
                            }
                            document.head.appendChild(el);
                        }
                        el.setAttribute('content', content);
                    }
                    
                    // Update all meta tags
                    setMeta('[property="og:title"]', title);
                    setMeta('[name="twitter:title"]', title);
                    
                    let description = project.description || '';
                    description = description.replace(/<[^>]*>/g, '');
                    if (description.length > 150) description = description.substring(0, 147) + '...';
                    if (!description) {
                        description = 'Interactive Production, Design & Development. A curated collection of games, software, websites, and creative experiments.';
                    }
                    setMeta('[property="og:description"]', description);
                    setMeta('[name="twitter:description"]', description);
                    
                    let media = 'tsp_social.png';
                    if (project.media && project.media.length > 0) {
                        media = project.media[0];
                    }
                    if (!media.startsWith('http://') && !media.startsWith('https://')) {
                        media = 'https://samoff.com/portfolio/' + media.replace(/^\.?\//, '');
                    }
                    setMeta('[property="og:image"]', media);
                    setMeta('[name="twitter:image"]', media);
                    
                    setMeta('[property="og:url"]', 'https://samoff.com/portfolio/');
                    
                    // Redirect to the main page
                    setTimeout(function() {
                        window.location.href = 'https://samoff.com/portfolio/?share=' + shareData;
                    }, 1500);
                })
                .catch(function(err) {
                    console.warn('Could not fetch projects:', err);
                    setTimeout(function() {
                        window.location.href = 'https://samoff.com/portfolio/';
                    }, 500);
                });
        })();
    </script>
</body>
</html>
